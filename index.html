<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản lý thiết bị CNTT</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2457c5">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6;--surface:#fff;--surface2:#f5f7fb;--ink:#14202e;--muted:#5a6779;--line:#d9e0ea;--line2:#b9c4d3;
  --accent:#2457c5;--accent-ink:#fff;--accent-soft:#dde7fb;
  --ok:#1b7f46;--ok-soft:#dcf2e4;--warn:#9a5b00;--warn-soft:#fbedcf;--bad:#b3321f;--bad-soft:#fbe2dc;--info:#17679e;--info-soft:#dcedf8;--mute:#667085;--mute-soft:#e7eaf0;
  --shadow:0 1px 2px rgba(20,32,46,.06),0 4px 14px rgba(20,32,46,.06);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141c;--surface:#161e29;--surface2:#1b2532;--ink:#e6edf6;--muted:#9aa9bb;--line:#263243;--line2:#3a4a60;
  --accent:#6ea0ff;--accent-ink:#06142e;--accent-soft:#16294d;
  --ok:#5fd08b;--ok-soft:#123826;--warn:#f0b04a;--warn-soft:#3a2c10;--bad:#ff8c78;--bad-soft:#47211b;--info:#64b5ee;--info-soft:#11304a;--mute:#98a4b5;--mute-soft:#263243;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.sm{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}.grow{flex:1;min-width:0}
.sr{position:absolute;left:-9999px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
/* layout */
#app{display:grid;grid-template-columns:244px 1fr;min-height:100%}
#side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}.brand b{display:block;font-size:15px}.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink)}
.nav:hover{background:var(--surface2)}.nav[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;padding:10px 8px 0;font-size:12px;color:var(--muted)}.side-foot p{margin:6px 0}
#main{min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
#top h1{font-size:18px;margin-right:auto}#menuBtn{display:none}
#view{padding:18px 20px 90px;max-width:1280px;width:100%;margin:0 auto}
#tabbar{display:none}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap;line-height:1.3;min-height:36px}
.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}.btn.ghost{border-color:transparent;background:none}.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}.btn.icon{padding:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--mute-soft);color:var(--mute);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}.card h2 .btn{margin-left:auto}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:block;width:100%}
.kpi:hover{border-color:var(--accent)}.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:26px;font-weight:700;font-family:var(--mono);margin-top:2px}.kpi .s{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}
.bar{height:8px;background:var(--mute-soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input[type=search],.toolbar select{min-height:36px}
input,select,textarea{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:7px 10px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:0;border-color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs .btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;margin-bottom:12px;background:var(--warn-soft)}.banner .grow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* table */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%}.tbl th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr:last-child td{border-bottom:0}.tbl tbody tr.click{cursor:pointer}.tbl tbody tr.click:hover{background:var(--surface2)}
.tbl td.act{white-space:nowrap;text-align:right}.empty{padding:28px;text-align:center;color:var(--muted)}
/* form */
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.f input,.f select,.f textarea{font-size:14px;color:var(--ink)}
.frm{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.frm .full{grid-column:1/-1}
details.more{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:8px 10px}details.more summary{cursor:pointer;font-weight:600;font-size:13px}details.more .frm{margin-top:10px}
/* modal */
#modal-root{position:fixed;inset:0;z-index:100;display:none;background:rgba(10,16,26,.5);align-items:center;justify-content:center;padding:16px}#modal-root.open{display:flex}
.modal{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column}.modal.lg{max-width:900px}
.modal>header{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}.modal>header h2{font-size:16px;margin-right:auto}
.modal .body{padding:16px 18px;overflow:auto}.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pick{border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto}.pick label{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}.pick label:last-child{border:0}.pick label:hover{background:var(--surface2)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px}.kv dt{color:var(--muted);font-size:12px;padding-top:2px}.kv dd{margin:0;word-break:break-word}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}#toast.show{opacity:1}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer}.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync.idle i{background:var(--ok)}.sync.syncing i,.sync.pending i{background:var(--warn)}.sync.error i,.sync.needauth i{background:var(--bad)}
.inv-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.inv-row:last-child{border:0}.inv-row.done{background:var(--ok-soft)}
.inv-row input{width:20px;height:20px;flex:none}
.hbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.hbar .n{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .bar{flex:1}.hbar .c{width:46px;text-align:right;font-family:var(--mono)}
/* login */
#login{position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
#login .box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 24px;text-align:center}
#login h1{margin:12px 0 2px;font-size:20px}#login p{margin:0 0 16px;color:var(--muted);font-size:13px}
#login .em{font-family:var(--mono);font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:0 0 14px}
#login input{width:100%;margin-bottom:10px;padding:10px}#login .go{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:11px;font-weight:600;cursor:pointer}#login .go:disabled{opacity:.6}
#login .err{color:var(--bad);font-size:13px;margin-top:10px}#login .hint{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:900px){
  #app{grid-template-columns:1fr}#side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}#side.open{transform:none}
  #menuBtn{display:inline-flex}#top{padding:10px 12px}#view{padding:12px 12px 90px}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  #tabbar button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}#tabbar svg.i{width:21px;height:21px}#tabbar button[aria-current=page]{color:var(--accent);font-weight:600}
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.kpi .v{font-size:22px}
  .frm{grid-template-columns:1fr}
  #modal-root{align-items:flex-end;padding:0}.modal,.modal.lg{max-width:none;border-radius:16px 16px 0 0;max-height:94vh}
  .kv{grid-template-columns:1fr}.kv dt{padding-top:6px}
  .tw{border:0;background:none;overflow:visible}table.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}.tbl thead{display:none}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:8px 10px}
  .tbl td{border:0;padding:2px 0;display:flex;gap:8px;justify-content:space-between;text-align:right}.tbl td::before{content:attr(data-l);color:var(--muted);font-size:12px;text-align:left;flex:none;padding-top:1px}
  .tbl td.t1{font-weight:600;font-size:15px;text-align:left;justify-content:flex-start}.tbl td.t1::before{display:none}.tbl td.act{justify-content:flex-end;padding-top:6px}.tbl td:empty{display:none}
  .toolbar input[type=search]{flex:1 1 100%}
}

</style>
</head>
<body>
<div id="app"><aside id="side"></aside><div id="main"><header id="top"></header><main id="view"></main></div><nav id="tabbar"></nav></div>
<div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
/* ===== Mô hình dữ liệu (thuần, không dùng DOM — chạy được cả trong trình duyệt lẫn Node) ===== */
const SEQ0={alloc:0,batch:0,repair:0,licCat:0,licAssign:0,licHist:0,inv:0,emp:0,audit:0};
const COLL=['depts','employees','assets','allocs','repairs','licCat','licAssign','licHist','audit','inventories'];
function blankDB(){return {v:1,rev:1,pid:'',deviceId:'',updatedAt:Date.now(),
  settings:{company:'JEANIC GARMENT',itName:'IT',prefix:'JGS-',warnDays:60,address:''},
  depts:[],employees:[],assets:[],stock:{},allocs:[],repairs:[],licCat:[],licAssign:[],licHist:[],audit:[],inventories:[],seq:Object.assign({},SEQ0)}}
function normalizeDB(d){
  const o=Object.assign(blankDB(),d||{});
  o.settings=Object.assign(blankDB().settings,(d&&d.settings)||{});
  COLL.forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  if(!o.stock||typeof o.stock!=='object'||Array.isArray(o.stock))o.stock={};
  o.seq=Object.assign({},SEQ0,o.seq||{});
  const bump=(k,arr)=>{const m=arr.reduce((x,r)=>Math.max(x,+r.id||0),0);if(o.seq[k]<m)o.seq[k]=m};
  bump('alloc',o.allocs);bump('repair',o.repairs);bump('licCat',o.licCat);bump('licAssign',o.licAssign);bump('licHist',o.licHist);bump('inv',o.inventories);bump('emp',o.employees);bump('audit',o.audit);
  const mb=o.allocs.reduce((x,r)=>Math.max(x,+r.batch||0),0);if(o.seq.batch<mb)o.seq.batch=mb;
  return o;
}

/* ===== Chuyển từ cơ sở dữ liệu SQLite của app cũ (IT_Asset_Data_V6.db) ===== */
// t: {TenBang:[{cột:giá trị}]}  →  {db, scans:[tên tệp biên bản đã ký cần tải lên]}
function legacyToDB(t){
  const s=v=>v==null?'':String(v), n=v=>+v||0, g=k=>t[k]||[];
  const db=blankDB();db.deviceId='';
  const nid=k=>++db.seq[k];
  db.depts=g('DanhMucPhongBan').map(r=>s(r.Ten)).filter(Boolean);
  g('NhanVien').forEach(r=>{db.employees.push({id:nid('emp'),name:s(r.HoTen),dept:s(r.PhongBan),status:s(r.TrangThai)||'Đang làm việc',joinDate:s(r.NgayVaoLam),leaveDate:s(r.NgayNghiViec)});
    if(r.PhongBan&&!db.depts.includes(s(r.PhongBan)))db.depts.push(s(r.PhongBan))});
  g('ThietBi').forEach(r=>db.assets.push({id:s(r.MaTaiSan),serial:s(r.SoSerial),brand:s(r.HangSX),type:s(r.Loai),model:s(r.Model),cpu:s(r.CPU),ram:s(r.RAM),disk:s(r.ODung),vga:s(r.VGA),screen:s(r.ManHinh),
    warranty:r.BaoHanhThang==null?12:n(r.BaoHanhThang),os:s(r.HDH),buyDate:s(r.NgayMua),winKey:s(r.KeyWindows),officeKey:s(r.KeyOffice),user:s(r.NguoiDung),value:n(r.GiaTri),deprMonths:r.ThoiGianKhauHaoThang==null?60:n(r.ThoiGianKhauHaoThang),
    note:s(r.GhiChu),group:s(r.NhomQuanLy)||'Tài sản',parent:s(r.MaTaiSanCha),retired:''}));
  g('KhoTaiSan').forEach(r=>{db.stock[s(r.MaTaiSan)]={inDate:s(r.NgayNhapKho),source:s(r.NguonNhap),location:s(r.ViTriKho),note:s(r.GhiChu)}});
  const base=p=>s(p).split(/[\\/]/).pop();
  const scans=new Set(),bk=new Map();
  g('CapPhat').slice().sort((a,b)=>n(a.ID)-n(b.ID)).forEach(r=>{
    const sc=base(r.FileBienBanDaKy);if(sc)scans.add(sc);
    const key=sc?'S|'+sc:['K',r.LoaiBB,r.NguoiNhan,r.PhongBan,r.NgayCapPhat].join('|');
    if(!bk.has(key))bk.set(key,nid('batch'));
    db.allocs.push({id:n(r.ID),type:s(r.LoaiBB)||'Bàn Giao',assetId:s(r.MaTaiSan),person:s(r.NguoiNhan),dept:s(r.PhongBan),date:s(r.NgayCapPhat),returnDate:s(r.NgayThuHoi),by:s(r.NguoiBanGiao)||'IT',cond:s(r.TinhTrangKhiCap),note:s(r.GhiChu),batch:bk.get(key),scan:sc?{name:sc,fileId:'',mime:''}:null});
  });
  g('SuaChua').forEach(r=>db.repairs.push({id:n(r.ID),assetId:s(r.MaTaiSan),reportDate:s(r.NgayBaoLoi),issue:s(r.MoTaSuCo),vendor:s(r.DonViSua),cost:n(r.ChiPhi),doneDate:s(r.NgayHoanThanh),result:s(r.TinhTrangSauSua),owner:s(r.NguoiPhuTrach),note:s(r.GhiChu)}));
  g('DanhMucBanQuyen').forEach(r=>db.licCat.push({id:n(r.ID),name:s(r.TenGoi),vendor:s(r.NhaCungCap),kind:s(r.Loai)||'Trả phí',priceMonth:n(r.DonGiaThang),priceYear:n(r.DonGiaNam),source:s(r.Nguon)}));
  g('CapPhatBanQuyen').forEach(r=>db.licAssign.push({id:n(r.ID),account:s(r.TenTaiKhoan),email:s(r.Email),person:s(r.HoTenNhanVien),dept:s(r.PhongBan),pkg:s(r.TenGoi),priceMonth:n(r.DonGiaThang),priceYear:n(r.DonGiaNam),note:s(r.GhiChu),
    status:s(r.TrangThai)||'Đang sử dụng',dateGiven:s(r.NgayCap),dateRevoked:s(r.NgayThu||r.NgayThuHoi),revokedBy:s(r.NguoiThuHoi)}));
  g('LichSuBanQuyen').forEach(r=>db.licHist.push({id:n(r.ID),assignId:n(r.CapPhatID),t:s(r.ThoiGian),action:s(r.HanhDong),account:s(r.TenTaiKhoan),email:s(r.Email),person:s(r.HoTenNhanVien),dept:s(r.PhongBan),pkg:s(r.TenGoi),by:s(r.NguoiThucHien),detail:s(r.NoiDung)}));
  g('AuditLog').forEach(r=>db.audit.push({id:n(r.ID),t:s(r.ThoiGian),user:s(r.NguoiDung),action:s(r.HanhDong),obj:s(r.DoiTuong),objId:s(r.MaDoiTuong),detail:s(r.ChiTiet)}));
  g('KiemKeDot').forEach(r=>{const items={};g('KiemKeChiTiet').filter(x=>n(x.KiemKeID)===n(r.ID)).forEach(x=>{items[s(x.MaTaiSan)]={checked:!!n(x.DaKiem),actual:s(x.TinhTrangThucTe),note:s(x.GhiChu)}});
    db.inventories.push({id:n(r.ID),name:s(r.TenDot),date:s(r.NgayTao).slice(0,10),by:s(r.NguoiTao),note:s(r.GhiChu),status:s(r.TrangThai)||'Đang kiểm kê',items})});
  COLL.forEach(k=>{});
  return {db:normalizeDB(db),scans:[...scans]};
}
if(typeof module!=='undefined')module.exports={blankDB,normalizeDB,legacyToDB};

/* ===== Tiện ích ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const money=n=>Math.round(+n||0).toLocaleString('vi-VN');
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowStr=()=>{const d=new Date();return today()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const dmy=s=>{s=String(s||'').slice(0,10);return /^\d{4}-\d\d-\d\d$/.test(s)?s.split('-').reverse().join('/'):s};
const dmyt=s=>{s=String(s||'');return dmy(s)+(s.length>10?' '+s.slice(11,16):'')};
const pd=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const addMonths=(s,n)=>{const d=pd(s);if(!d)return '';const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const daysTo=s=>{const d=pd(s),t=pd(today());return d?Math.round((d-t)/864e5):null};
const monthsBetween=(a,b)=>{const x=pd(a),y=pd(b);if(!x||!y)return 0;return Math.max(0,(y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth()-(y.getDate()<x.getDate()?1:0))};

      if(!force){const t=await GD.pull();const rem=t&&safeParse(t);if(rem&&rem.pid!==CFG.syncPid){this.busy=false;showConflict(rem,CFG.syncPid?'changed':'first');return}}

    }catch(e){if(e.code==='auth')setSync('needauth',e.message);else setSync('error',e.message||String(e))}

    catch(e){setSync(e.code==='auth'?'needauth':'error',e.message)}},

    const j=await(await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime&fields=files(id)`)).json();
    if(j.files&&j.files.length)this.folderId=j.files[0].id;
    else this.folderId=(await(await this.api('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})})).json()).id;
    CFG.gFolderId=this.folderId;saveCfg();return this.folderId},
  async findFile(){
    if(this.fileId)return this.fileId;
    if(CFG.gFileId){const r=await this.api(`https://www.googleapis.com/drive/v3/files/${CFG.gFileId}?fields=id,trashed`,{ok404:true});if(r){const j=await r.json();if(!j.trashed)return this.fileId=j.id}CFG.gFileId=null;CFG.gFolderId=null;this.folderId=null;saveCfg()}
    const f=await this.folder();const q=encodeURIComponent(`name='${DRIVE_FILE}' and '${f}' in parents and trashed=false`);
    const j=await(await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime&fields=files(id)`)).json();
    this.fileId=(j.files&&j.files[0]&&j.files[0].id)||null;if(this.fileId){CFG.gFileId=this.fileId;saveCfg()}return this.fileId},
  async pull(){const id=await this.findFile();if(!id)return null;return(await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).text()},
  async upload(name,data,id,mime){
    mime=mime||'application/json';
    if(id){await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':mime},body:data});return id}
    const f=await this.folder(),b='tt'+uid();
    const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:[f]})}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`,data,`\r\n--${b}--`]);
    const r=await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
    return(await r.json()).id},
  async push(text){const id=await this.findFile();this.fileId=await this.upload(DRIVE_FILE,text,id);if(CFG.gFileId!==this.fileId){CFG.gFileId=this.fileId;saveCfg()}},
  async getBlob(id){return(await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).blob()},
  disconnect(){this.token=null;this.exp=0;this.fileId=null;this.folderId=null;CFG.gFileId=null;CFG.gFolderId=null;saveCfg();try{localStorage.removeItem('itam.gd')}catch(e){}}
};

/* ===== Đăng nhập: mã xác minh gửi về Gmail của chủ ứng dụng ===== */
const AUTH_KEY='itam.auth',AUTH_TTL=12*3600*1000,OTP_KEY='itam.otpurl';
function authOK(){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');return !!a&&a.email===AUTH_EMAIL&&Date.now()<a.exp}catch(e){return false}}
function authSet(){try{localStorage.setItem(AUTH_KEY,JSON.stringify({email:AUTH_EMAIL,exp:Date.now()+AUTH_TTL}))}catch(e){}}
function otpUrl(){let u='';try{u=localStorage.getItem(OTP_KEY)||''}catch(e){}return u||DEFAULT_OTP_URL}
async function otpCall(a,extra){
  const u=otpUrl();if(!u)throw new Error('Chưa có địa chỉ dịch vụ gửi mã');
  let r;try{r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({a},extra||{}))})}catch(e){throw new Error('Không kết nối được dịch vụ gửi mã, kiểm tra mạng và địa chỉ đã dán')}
  let j;try{j=await r.json()}catch(e){throw new Error('Địa chỉ dịch vụ không đúng hoặc chưa triển khai "Bất kỳ ai"')}
  if(!j.ok)throw new Error(j.error||'Có lỗi xảy ra');return j}
function loginScreen(){return new Promise(done=>{
  const el=document.createElement('div');el.id='login';let step='start',err='',info='',cool=0,tick=null,editUrl=false;
  const draw=()=>{const needUrl=!otpUrl()||editUrl;
    el.innerHTML=`<div class="box"><div style="font-size:40px">${icon('laptop')}</div><h1>${esc(APP_NAME)}</h1><p>Đăng nhập để sử dụng ứng dụng</p><div class="em">${esc(AUTH_EMAIL)}</div>
    ${step==='start'?`${needUrl?`<input id="lurl" type="text" placeholder="Dán địa chỉ dịch vụ gửi mã (làm một lần)" autocomplete="off" spellcheck="false" value="${esc(otpUrl())}">`:''}<button class="go" id="lgsend">Gửi mã xác minh về Gmail</button>`
    :`<input id="lcode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="Nhập mã 6 số" style="text-align:center;font-size:20px;letter-spacing:4px"><button class="go" id="lgok">Xác nhận</button><button class="go" id="lgre" style="background:transparent;color:var(--accent);margin-top:8px;font-weight:500" ${cool>0?'disabled':''}>${cool>0?`Gửi lại mã sau ${cool}s`:'Gửi lại mã'}</button>`}
    ${err?`<div class="err" role="alert">${esc(err)}</div>`:''}${info?`<p class="hint">${esc(info)}</p>`:''}
    ${step==='start'&&!needUrl?'<p class="hint"><a href="#" id="lgurl" style="color:var(--accent)">Đổi địa chỉ dịch vụ gửi mã</a></p>':''}
    <p class="hint">${step==='start'?'Mã 6 số sẽ được gửi tới email trên. Kiểm tra cả mục Thư rác nếu chưa thấy.':'Mã có hiệu lực 10 phút.'}</p></div>`;
    const b=$('#lgsend',el);if(b)b.onclick=()=>send(b);
    const ok=$('#lgok',el);if(ok){ok.onclick=()=>verify(ok);const c=$('#lcode',el);c.focus();c.oninput=()=>{c.value=c.value.replace(/\D/g,'');if(c.value.length===6)verify(ok)}}
    const re=$('#lgre',el);if(re)re.onclick=()=>send(re);
    const cu=$('#lgurl',el);if(cu)cu.onclick=e=>{e.preventDefault();editUrl=true;err='';draw()}};
  const startCool=()=>{cool=45;clearInterval(tick);tick=setInterval(()=>{cool--;if(cool<=0){clearInterval(tick);cool=0}const re=$('#lgre',el);if(re){re.disabled=cool>0;re.textContent=cool>0?`Gửi lại mã sau ${cool}s`:'Gửi lại mã'}},1000)};
  const send=async b=>{const ui=$('#lurl',el);
    if(ui){const v=ui.value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(v)){err='Địa chỉ không đúng định dạng (phải bắt đầu bằng https://script.google.com/macros/s/ và kết thúc bằng /exec)';return draw()}try{localStorage.setItem(OTP_KEY,v)}catch(e){}}
    b.disabled=true;b.textContent='Đang gửi mã…';
    try{await otpCall('send');err='';info='Đã gửi mã tới '+AUTH_EMAIL;step='code';startCool();draw()}catch(e){err=e.message;editUrl=true;step='start';draw()}};
  const verify=async b=>{const code=($('#lcode',el).value||'').trim();if(code.length!==6){err='Hãy nhập đủ 6 số';return draw()}
    b.disabled=true;b.textContent='Đang xác nhận…';
    try{await otpCall('verify',{code});authSet();clearInterval(tick);el.remove();done()}catch(e){err=e.message;info='';draw()}};
  draw();document.body.appendChild(el)})}

function doAlloc(d,ids){
  const type=d.type,date=d.date,by=d.by||'IT',batch=nextId('batch');let all=[...ids];
  if(d.kids){ids.forEach(id=>DB.assets.filter(k=>k.parent===id&&!k.retired).forEach(k=>{if(!all.includes(k.id)&&(type==='Bàn Giao'?!k.user:k.user===asset(id).user))all.push(k.id)}))}
  const created=[];
  all.forEach(id=>{const a=asset(id);if(!a)return;
    const prev=openAlloc(id);const holder=a.user;
    if(prev&&type!=='Bàn Giao')prev.returnDate=date;
    const person=type==='Thu Hồi'?holder:d.person,dept=type==='Thu Hồi'?(prev?prev.dept:(empByName(holder)||{}).dept||''):d.dept;
    const rec={id:nextId('alloc'),type,assetId:id,person:person||'',dept:dept||'',date,returnDate:type==='Thu Hồi'?date:'',by,cond:d.cond,note:d.note||'',batch,scan:null};
    DB.allocs.push(rec);created.push(rec);
    a.user=type==='Thu Hồi'?'':d.person;
    if(!DB.stock[id])DB.stock[id]={inDate:'',source:'',location:'',note:''};
    log(type==='Bàn Giao'?'Bàn giao thiết bị':type==='Thu Hồi'?'Thu hồi thiết bị':'Điều chuyển thiết bị','ThietBi',id,type==='Thu Hồi'?`Thu hồi từ ${holder||'—'}`:`${holder?holder+' → ':''}${d.person}${d.dept?' ('+d.dept+')':''}`)});
  save();return {batch,n:created.length}}

async function compressImage(file){
  if(!/^image\//.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.82))}catch(e){return file}}

   modal('Nhập từ app quản lý thiết bị cũ',`<p style="margin-top:0">Tìm thấy: <b>${d.assets.length}</b> thiết bị, <b>${d.employees.length}</b> nhân viên, <b>${d.allocs.length}</b> phiếu cấp phát, <b>${d.licAssign.length}</b> bản quyền, <b>${d.repairs.length}</b> phiếu sửa, <b>${d.inventories.length}</b> đợt kiểm kê, <b>${d.audit.length}</b> dòng nhật ký.</p><p>Dữ liệu hiện tại sẽ được thay thế (có lưu bản chụp để khôi phục).</p>
   ${res.scans.length?(can?`<label><input type="checkbox" id="upScan" checked> Tải ${res.scans.length} bản ký (ảnh biên bản) lên Google Drive</label>`:`<div class="banner">${icon('alert',18)}<div>${Sync.driver?'Không thấy ảnh bản ký trong tệp này.':'Kết nối Google Drive trước nếu muốn đưa ảnh bản ký lên Drive (có thể đính kèm lại sau).'}</div></div>`):''}`,
   {footer:`<button class="btn" data-act="close">Hủy</button><button class="btn primary" data-act="legacyGo">Nhập dữ liệu</button>`,nofocus:1});window.__leg={res,atts}}catch(e){toast(e.message||'Không đọc được tệp')}})},
 legacyGo(){const {res,atts}=window.__leg,up=!!($('#upScan')&&$('#upScan').checked);closeModal();applyLegacy(res,atts,up)},
 snapRestore(d){ask('Khôi phục bản chụp','Thay dữ liệu hiện tại bằng bản chụp này?','Khôi phục',async()=>{const v=await idb.get(d.v);replaceDB(normalizeDB(JSON.parse(v.json)),'khôi phục bản chụp')},true)},
 useRemote(){closeModal();snapshot('Bản trên máy trước khi lấy từ Drive').then(()=>adoptRemote(window.__rem,'Đã lấy dữ liệu từ Google Drive'))},
 async useLocal(){closeModal();try{await idb.set('snap:'+Date.now(),{t:Date.now(),reason:'Bản trên Drive trước khi bị ghi đè',json:JSON.stringify(window.__rem)})}catch(e){}Sync.push(true)},
 logout(){try{localStorage.removeItem(AUTH_KEY)}catch(e){}location.reload()}
};
const SUB={
 asset(d){const orig=d.orig,id=(orig||d.id||'').trim();if(!id)return;if(!orig&&asset(id)){toast('Mã tài sản đã tồn tại');return}
   const b={group:d.group,type:d.type.trim(),brand:d.brand.trim(),model:d.model.trim(),serial:d.serial.trim(),parent:d.parent,buyDate:d.buyDate,warranty:+d.warranty||0,value:+d.value||0,deprMonths:+d.deprMonths||0,cpu:d.cpu,ram:d.ram,disk:d.disk,vga:d.vga,screen:d.screen,os:d.os,winKey:d.winKey.trim(),officeKey:d.officeKey.trim(),note:d.note};
   if(orig)Object.assign(asset(orig),b);else DB.assets.push(Object.assign({id,user:'',retired:''},b));
   DB.stock[id]=Object.assign({inDate:today(),note:''},DB.stock[id]||{},{source:d.source,location:d.location});
   log((orig?'Sửa ':'Thêm ')+(b.group==='Phụ kiện'?'phụ kiện/linh kiện':'tài sản'),'ThietBi',id,[b.type,b.model,'Serial: '+b.serial].join(' / '));save();closeModal();render();toast(orig?'Đã lưu thay đổi':'Đã thêm '+id)},
 alloc(d,f){const ids=$$('input[name=a]:checked',f).map(x=>x.value);d.kids=!!d.kids;if(!ids.length){toast('Hãy chọn ít nhất một thiết bị');return}
   if(d.type!=='Thu Hồi'){d.person=(d.person||'').trim();if(!d.person){toast('Hãy nhập người nhận');return}const e=empByName(d.person);if(e&&!d.dept)d.dept=e.dept}
   const r=doAlloc(d,ids);closeModal();render();const b=bbOf(r.batch);
   modal('Đã lập biên bản',`<p style="margin:0">Đã tạo <b>${bbNo(b)}</b> — ${esc(d.type)} ${r.n} thiết bị${d.type!=='Thu Hồi'?' cho <b>'+esc(d.person)+'</b>':''}. In biên bản để hai bên ký, sau đó chụp ảnh bản đã ký và đính kèm vào biên bản.</p>`,{footer:`<button class="btn" data-act="close">Đóng</button><button class="btn primary" data-act="printbb" data-v="${r.batch}">${icon('print',14)}In biên bản</button>`,nofocus:1})},
 stock(d){DB.stock[d.id]=Object.assign(DB.stock[d.id]||{},{source:d.source,inDate:d.inDate,location:d.location,note:d.note});log('Sửa thông tin kho','KhoTaiSan',d.id,d.location);save();closeModal();render()},
 repair(d){if(!d.assetId){toast('Hãy chọn thiết bị');return}
   if(d.id){const r=DB.repairs.find(x=>x.id==d.id);Object.assign(r,{assetId:d.assetId,reportDate:d.reportDate,issue:d.issue,vendor:d.vendor,owner:d.owner,note:d.note,cost:+d.cost||0,doneDate:d.doneDate||'',result:d.result||''});log('Sửa phiếu sửa chữa','SuaChua',d.assetId,d.issue)}
   else{DB.repairs.push({id:nextId('repair'),assetId:d.assetId,reportDate:d.reportDate,issue:d.issue,vendor:d.vendor,cost:0,doneDate:'',result:'',owner:d.owner,note:d.note});log('Báo sửa chữa','SuaChua',d.assetId,d.issue)}
   save();closeModal();render();toast('Đã lưu phiếu sửa chữa')},
 repairDone(d){const r=DB.repairs.find(x=>x.id==d.id);Object.assign(r,{doneDate:d.doneDate,cost:+d.cost||0,vendor:d.vendor,result:d.result,note:d.note});log('Hoàn thành sửa chữa','SuaChua',r.assetId,`${d.result} · ${money(r.cost)} đ`);save();closeModal();render();toast('Đã hoàn thành sửa chữa')},
 cat(d){const o={name:d.name.trim(),vendor:d.vendor,kind:d.kind,priceMonth:+d.priceMonth||0,priceYear:+d.priceYear||0,source:d.source};if(d.id){const c=DB.licCat.find(x=>x.id==d.id);if(c.name!==o.name)DB.licAssign.forEach(l=>{if(l.pkg===c.name)l.pkg=o.name});Object.assign(c,o)}else DB.licCat.push(Object.assign({id:nextId('licCat')},o));save();closeModal();render()},
 lic(d){const o={account:d.account.trim(),email:d.email.trim(),person:d.person.trim(),dept:d.dept.trim(),pkg:d.pkg,priceMonth:+d.priceMonth||0,priceYear:+d.priceYear||0,note:d.note,dateGiven:d.dateGiven};
   if(!o.dept&&o.person){const e=empByName(o.person);if(e)o.dept=e.dept}
   if(d.id){const l=DB.licAssign.find(x=>x.id==d.id);Object.assign(l,o);licLog(l,'Chỉnh sửa','Sửa thông tin bản quyền');log('Chỉnh sửa bản quyền','CapPhatBanQuyen',o.account,o.pkg)}
   else{const l=Object.assign({id:nextId('licAssign'),status:'Đang sử dụng',dateRevoked:'',revokedBy:''},o);DB.licAssign.push(l);licLog(l,'Cấp phát','Cấp phát mới');log('Cấp phát bản quyền','CapPhatBanQuyen',o.account,`${o.pkg} → ${o.person||o.account}`)}
   save();closeModal();render();toast('Đã lưu')},
 licRevoke(d){const l=DB.licAssign.find(x=>x.id==d.id);l.status='Đã thu hồi';l.dateRevoked=d.date;l.revokedBy=d.by;licLog(l,'Thu hồi',d.note||'Thu hồi quyền sử dụng');log('Thu hồi bản quyền','CapPhatBanQuyen',l.account,`${l.pkg} ← ${l.person||l.account}`);save();closeModal();render();toast('Đã thu hồi')},
 emp(d){const name=d.name.trim();if(!name)return;if(DB.employees.some(e=>e.name===name&&e.id!=d.id)){toast('Đã có nhân viên trùng tên này');return}
   const o={name,dept:d.dept.trim(),status:d.status,joinDate:d.joinDate,leaveDate:d.status==='Nghỉ việc'?(d.leaveDate||today()):d.leaveDate};
   if(o.dept&&!DB.depts.includes(o.dept))DB.depts.push(o.dept);
   if(d.id){const e=DB.employees.find(x=>x.id==d.id);if(e.name!==name)renameRef('person',e.name,name);Object.assign(e,o);log('Sửa nhân viên','NhanVien',name,o.dept+' / '+o.status)}
   else{DB.employees.push(Object.assign({id:nextId('emp')},o));log('Thêm nhân viên','NhanVien',name,o.dept)}
   save();closeModal();render()},
 dept(d){const n=d.name.trim();if(!n)return;if(DB.depts.includes(n)&&n!==d.orig){toast('Phòng ban đã tồn tại');return}if(d.orig){renameRef('dept',d.orig,n);DB.depts=DB.depts.map(x=>x===d.orig?n:x)}else DB.depts.push(n);save();closeModal();render()},
 inv(d){const items={};DB.assets.filter(a=>!a.retired).forEach(a=>{items[a.id]={checked:false,actual:'',note:'',holder:a.user||''}});const i={id:nextId('inv'),name:d.name.trim(),date:d.date,by:d.by,note:d.note,status:'Đang kiểm kê',items};DB.inventories.push(i);log('Tạo đợt kiểm kê','KiemKe',i.id,i.name);save();closeModal();UI.view='inv';UI.sel={inv:i.id};UI.f.inv={};render()},
 invNote(d){const i=DB.inventories.find(x=>x.id===UI.sel.inv),it=i.items[d.id];it.actual=d.actual;it.note=d.note;if(d.actual==='Không tìm thấy')it.checked=false;save();closeModal();render(true)},
 settings(d){Object.assign(DB.settings,{company:d.company,itName:d.itName,address:d.address,prefix:d.prefix,warnDays:+d.warnDays||60});save();toast('Đã lưu');render(true)},
 cfg(d){CFG.gClientId=d.gClientId.trim();saveCfg();const u=(d.otp||'').trim();try{if(u)localStorage.setItem(OTP_KEY,u);else localStorage.removeItem(OTP_KEY)}catch(e){}toast('Đã lưu cấu hình kết nối')}
};
const INP={
 flt(t){fl()[t.dataset.k]=t.value;relist()},
 pickq(t){const q=fold(t.value);$$('#pickbox label').forEach(l=>{l.style.display=!q||l.dataset.t.includes(q)?'':'none'})},
 empPick(t){const e=empByName(t.value.trim());if(e){const f=t.form,dd=f.elements.dept;if(dd&&!dd.value)dd.value=e.dept}}
};
const CHG={
 flt(t){INP.flt(t)},
 allocType(t){const f=t.form,chosen=$$('input[name=a]:checked',f).map(x=>x.value);$('#pickbox').innerHTML=allocPick(t.value,chosen);$('#whoBox').style.display=t.value==='Thu Hồi'?'none':'';},
 licPkg(t){const c=DB.licCat.find(x=>x.name===t.value);if(c){t.form.elements.priceMonth.value=c.priceMonth;t.form.elements.priceYear.value=c.priceYear}},
 empPick(t){INP.empPick(t)}
};
function bindEvents(){
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-act]');if(!t){if(e.target.id==='modal-root')closeModal();return}
    if(t.tagName==='A')e.preventDefault();
    const fn=ACT[t.dataset.act];if(fn)fn(t.dataset,t,e)});
  document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.input;if(k&&INP[k])INP[k](t)});
  document.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.change;if(k&&CHG[k])CHG[k](t)});
  document.addEventListener('submit',e=>{const f=e.target,k=f.dataset&&f.dataset.submit;if(!k||!SUB[k])return;e.preventDefault();SUB[k](fdata(f),f)});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&$('#modal-root').classList.contains('open'))closeModal();
    const t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.enter==='invScan'){e.preventDefault();const i=DB.inventories.find(x=>x.id===UI.sel.inv),c=t.value.trim().toLowerCase();if(!c)return;
      const id=Object.keys(i.items).find(x=>x.toLowerCase()===c)||Object.keys(i.items).find(x=>String((asset(x)||{}).serial||'').toLowerCase()===c);
      if(id){i.items[id].checked=true;save();render(true);toast('✓ '+id+' — '+((asset(id)||{}).model||''))}else toast('Không có mã “'+t.value+'” trong đợt kiểm kê');
      const n=$('#invScan');if(n){n.value='';n.focus()}}});
}
function pristine(){return !DB.assets.length&&!DB.allocs.length&&!DB.employees.length&&!DB.licAssign.length}
const _render=render;render=function(keep){const y=window.scrollY;_render();if(keep)window.scrollTo(0,y)};
async function boot(){
  if(!authOK())await loginScreen();
  DB=loadLocal();if(!DB){DB=normalizeDB(null);DB.deviceId=uid();persistLocal()}
  UI.view=NAV.some(n=>n.id===CFG.view)?CFG.view:'dash';
  bindEvents();await loadSnaps();render();
  window.addEventListener('beforeunload',flushAll);window.addEventListener('beforeunload',e=>{if(Sync.driver&&DB.rev>CFG.syncRev){e.preventDefault();e.returnValue=''}});window.addEventListener('pagehide',flushAll);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll();else Sync.checkRemote()});window.addEventListener('focus',()=>Sync.checkRemote());
  setInterval(()=>{if(!document.hidden)Sync.checkRemote()},60000);window.addEventListener('online',()=>{if(Sync.driver&&Sync.state==='error')Sync.push()});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(CFG.driver==='gdrive')Sync.startup();else setSync('local');
  let tried=false;const gest=e=>{if(tried||!Sync.driver||Sync.state!=='needauth'||Sync.busy)return;if(e.target.closest&&e.target.closest('[data-act="syncchip"]'))return;tried=true;reauth(true)};
  document.addEventListener('pointerdown',gest,true);document.addEventListener('keydown',gest,true);
}
boot();

})();
</script>
